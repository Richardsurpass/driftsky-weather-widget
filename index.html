<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>driftsky | Leeds Bradford Live Weather Widget</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent !important; font-family:Arial,Helvetica,sans-serif; color:white; }
  * { box-sizing:border-box; }
  /* Compact panel sits just ABOVE an existing lower third, without covering the aircraft. */
  #widget { position:absolute; right:2.2%; bottom:21.5%; width:min(950px,94vw); background:linear-gradient(110deg,rgba(5,18,31,.94),rgba(9,34,53,.91)); border:2px solid #16c8e9; border-radius:10px; box-shadow:0 0 13px rgba(0,210,255,.18); padding:16px 22px 12px; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; border-bottom:1px solid rgba(47,216,246,.30); padding-bottom:9px; }
  .airport { font-size:23px; font-weight:800; letter-spacing:.7px; white-space:nowrap; }
  .airport span { color:#16d1f3; }
  .cells { display:grid; grid-template-columns:1.25fr .7fr 1fr 1.25fr; gap:12px; }
  .cell:not(:first-child) { border-left:1px solid rgba(255,255,255,.20); padding-left:14px; }
  .lab { font-size:14px; color:#83dff4; font-weight:700; letter-spacing:1.2px; margin-bottom:5px; }
  .val { font-size:25px; font-weight:800; white-space:nowrap; }
  .weather-text { font-size:22px; }
  .foot { display:flex; justify-content:space-between; color:#acbfc9; font-size:11px; margin-top:11px; }
  .status { color:#9ce4f4; }
  @media(max-width:800px){#widget{width:96vw;right:2vw;padding:10px 12px;bottom:22%}.airport{font-size:14px}.lab{font-size:9px}.val{font-size:13px}.weather-text{font-size:12px}.cells{gap:5px}.cell:not(:first-child){padding-left:5px}.foot{font-size:8px}}
</style>
</head>
<body>
  <section id="widget" aria-label="Leeds Bradford Airport weather overlay">
    <div class="head"><div class="airport">LEEDS BRADFORD <span>EGNM</span></div><div style="color:#d7e8ee;font-size:15px;font-weight:700">LIVE AIRPORT WEATHER</div></div>
    <div class="cells">
      <div class="cell"><div class="lab">UK LOCAL TIME</div><div class="val" id="clock">--:--:--</div></div>
      <div class="cell"><div class="lab">TEMP</div><div class="val" id="temp">--°C</div></div>
      <div class="cell"><div class="lab">WIND</div><div class="val" id="wind">--</div></div>
      <div class="cell"><div class="lab">CONDITIONS</div><div class="val weather-text" id="weather">Loading...</div></div>
    </div>
    <div class="foot"><span>Model weather near EGNM · Weather data: Open-Meteo.com (CC BY 4.0)</span><span class="status" id="status">Connecting...</span></div>
  </section>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const formatter = new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
  const dateFormatter = new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  function clock(){ $('clock').textContent=formatter.format(new Date()); }
  clock();setInterval(clock,1000);
  const directions=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  function describe(code){
    if(code===0)return 'Clear';
    if(code===1)return 'Mainly clear';
    if(code===2)return 'Partly cloudy';
    if(code===3)return 'Overcast';
    if(code===45||code===48)return 'Fog';
    if([51,53,55,56,57].includes(code))return 'Drizzle';
    if([61,63,65,66,67].includes(code))return 'Rain';
    if([71,73,75,77].includes(code))return 'Snow';
    if([80,81,82].includes(code))return 'Showers';
    if([85,86].includes(code))return 'Snow showers';
    if([95,96,99].includes(code))return 'Thunderstorm';
    return 'Variable';
  }
  const endpoint='https://api.open-meteo.com/v1/forecast?latitude=53.8659&longitude=-1.6606&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=mph&temperature_unit=celsius&timezone=Europe%2FLondon';
  let lastSuccess=null;
  async function update(){
    try{
      const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);
      let response;
      try{response=await fetch(endpoint+'&_='+Date.now(),{cache:'no-store',signal:controller.signal});}finally{clearTimeout(timeout);}
      if(!response.ok)throw new Error('HTTP '+response.status);
      const json=await response.json();const current=json.current;
      if(!current||!Number.isFinite(current.temperature_2m)||!Number.isFinite(current.wind_speed_10m)||!Number.isFinite(current.wind_direction_10m))throw new Error('Missing values');
      $('temp').textContent=Math.round(current.temperature_2m)+'°C';
      const dir=directions[Math.round(current.wind_direction_10m/22.5)%16];
      $('wind').textContent=dir+' '+Math.round(current.wind_speed_10m)+' mph';
      $('weather').textContent=describe(current.weather_code);
      lastSuccess=Date.now(); $('status').textContent='Updated '+dateFormatter.format(new Date());
    }catch(e){
      $('status').textContent=lastSuccess?'Weather update delayed':'Weather unavailable';
      if(!lastSuccess){$('temp').textContent='--°C';$('wind').textContent='--';$('weather').textContent='Unavailable';}
    }
  }
  update();setInterval(update,5*60*1000);
})();
</script>
</body>
</html>
