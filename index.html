<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>driftsky v17 — Clear Landing and Take-off Symbols | EGNM Broadcast Overlay</title>
<style>
:root{--electric:#168dff;--soft:#80bfff;--white:#f7fbff;--muted:#bbcee4;--navy:rgba(4,10,20,.96);--rule:rgba(36,146,255,.53)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;color:var(--white);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
#overlay{position:fixed;inset:0;pointer-events:none}
.strip{position:absolute;left:.6%;right:.6%;background:linear-gradient(110deg,rgba(4,8,16,.96),rgba(10,17,29,.96) 55%,rgba(4,8,16,.96));box-shadow:0 1px 8px rgba(0,0,0,.30)}
.strip::before,.strip::after{content:"";position:absolute;width:42px;height:4px;background:var(--electric);box-shadow:0 0 9px rgba(22,141,255,.24)}
.top{top:1.1%;height:clamp(54px,6.4vh,76px);clip-path:polygon(0 0,100% 0,97.2% 100%,2.8% 100%);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:0 clamp(36px,4.0vw,80px)}
.top::before{left:0;bottom:12px;transform:rotate(49deg);transform-origin:left center}
.top::after{right:0;bottom:12px;transform:rotate(-49deg);transform-origin:right center}
.location{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.airport{display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(12px,1.03vw,20px);letter-spacing:.015em;white-space:nowrap}
.airport span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blue{color:var(--electric)}
.airport .slash{margin:0 5px;color:var(--electric);font-weight:500}
.clock{font-size:clamp(11px,.88vw,17px);letter-spacing:.09em;color:#e0ecf7;font-weight:650;margin-left:31px;font-variant-numeric:tabular-nums}
.ico{color:var(--electric);width:clamp(16px,1.2vw,25px);height:clamp(16px,1.2vw,25px);flex:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand{justify-self:center;font-weight:900;font-style:italic;font-size:clamp(23px,2.00vw,38px);letter-spacing:-1.5px;white-space:nowrap;text-shadow:0 1px 2px #000}
.weather{justify-self:end;display:flex;align-items:center;min-width:0;white-space:nowrap;gap:clamp(7px,.8vw,18px);font-weight:750;font-size:clamp(11px,.9vw,18px)}
.weather .piece{display:flex;gap:6px;align-items:center;max-width:160px}
.weather .divider{width:1px;height:24px;background:var(--rule)}
#conditions{max-width:160px;overflow:hidden;text-overflow:ellipsis}
.bottom{bottom:1.4%;height:clamp(78px,8.0vh,94px);clip-path:polygon(2.7% 0,97.3% 0,100% 100%,0 100%);padding:8px clamp(40px,4.25vw,85px) 7px;display:flex;flex-direction:column;justify-content:center;gap:3px;border-top:1px solid rgba(22,141,255,.66)}
.bottom::before{left:0;top:22px;transform:rotate(-49deg);transform-origin:left center}
.bottom::after{right:0;top:22px;transform:rotate(49deg);transform-origin:right center}
.lineup{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,1.06fr) minmax(120px,.58fr);min-width:0;min-height:0;width:100%;align-items:center;flex:1;gap:0}
.flight{display:flex;align-items:center;gap:clamp(8px,1.15vw,24px);min-width:0;padding-right:clamp(10px,1.2vw,24px)}
.flight+.flight{border-left:1px solid var(--rule);padding-left:clamp(12px,2vw,42px)}
.flight .flight-icon{width:clamp(22px,1.8vw,35px);height:clamp(22px,1.8vw,35px);color:var(--electric);flex-shrink:0}
.flight .flight-icon{display:flex;align-items:center;justify-content:center;font-size:clamp(23px,2.1vw,38px);line-height:1;font-family:"Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal;}
.flight-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.flight-label{font-size:clamp(9px,.69vw,13px);color:#77b7ff;font-weight:800;letter-spacing:.09em;white-space:nowrap}
.flight-main{font-size:clamp(13px,1.09vw,22px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.10;font-variant-numeric:tabular-nums}
.flight-main .route{font-weight:650;color:#ecf5ff}
.flight-main .sep{color:var(--electric);padding:0 .45em}
.subscribe{height:100%;border-left:1px solid var(--rule);display:flex;align-items:center;justify-content:flex-end;gap:clamp(6px,.8vw,18px);min-width:0;white-space:nowrap;color:#fff;font-size:clamp(10px,.89vw,16px);font-weight:850;letter-spacing:.025em}
.subscribe .yt{width:clamp(18px,1.3vw,27px);height:clamp(18px,1.3vw,27px);color:var(--electric)}
.subscribe .bell{width:clamp(16px,1.05vw,22px);height:clamp(16px,1.05vw,22px);color:var(--electric)}
.subscribe.highlight .bell{animation:ring .9s ease both}
@keyframes ring{0%,100%{transform:rotate(0)}28%{transform:rotate(-20deg)}60%{transform:rotate(18deg)}}
.attribution{font-size:clamp(8px,.57vw,10px);height:12px;line-height:12px;flex-shrink:0;color:#9db5cc;letter-spacing:.012em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Angular electric-blue edge details matching the approved broadcast mock-up. */
.accent{position:absolute;pointer-events:none;z-index:4;overflow:visible;stroke:var(--electric);stroke-width:4;fill:none;stroke-linecap:square;filter:drop-shadow(0 0 2px rgba(22,141,255,.18))}
.accent.top-left{left:.6%;top:1.1%;width:65px;height:clamp(54px,6.4vh,76px)}
.accent.top-right{right:.6%;top:1.1%;width:65px;height:clamp(54px,6.4vh,76px)}
.accent.bottom-left{left:.6%;bottom:1.4%;width:65px;height:clamp(78px,8.0vh,94px)}
.accent.bottom-right{right:.6%;bottom:1.4%;width:65px;height:clamp(78px,8.0vh,94px)}
/* Keep flight identity readable while reserving room for ETA and delay badge. */
.flight-main{display:flex;align-items:center;gap:clamp(4px,.35vw,8px);min-width:0;overflow:hidden;}
.flight-main .code{flex:none}
.flight-main .sep{flex:none;padding:0 .16em}
.flight-main .route{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.flight-main .flight-time{flex:none;color:var(--white)}
.flight-main .delay-badge{flex:none;color:#ffcd67;border:1px solid rgba(255,190,70,.7);border-radius:3px;padding:2px 4px;font-size:clamp(10px,.65vw,12px);letter-spacing:.03em;font-weight:900;line-height:1}
.cached-schedule .flight-label{color:#ffcd67}
.flight-main .scheduled-tag{flex:none;color:#ffcd67;font-size:clamp(8px,.55vw,10px);font-weight:800}
@media(max-width:1350px){.flight-main .delay-badge{font-size:10px;padding:1px 3px}.flight-main{gap:4px}}
/* Keep the original photo clear even on a 720p YouTube player. */
@media(max-width:1350px){.top{padding-left:44px;padding-right:44px}.airport{gap:5px}.airport .slash{margin:0 1px}.location{max-width:36vw}.bottom{padding-left:48px;padding-right:48px}.flight{gap:8px}.flight+.flight{padding-left:14px}.weather{gap:8px}.weather .piece{gap:4px}}
@media(max-width:1050px){.top{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.airport{font-size:11px}.weather{font-size:11px}.weather .piece:nth-of-type(3){display:none}.brand{font-size:22px}.bottom{padding-left:40px;padding-right:40px}.lineup{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 128px}.flight-main{font-size:13px}.subscribe{font-size:10px}}
@media(prefers-reduced-motion:reduce){.subscribe.highlight .bell{animation:none}}
</style>
</head>
<body>
<main id="overlay" aria-label="driftsky livestream overlay">
  <header class="strip top">
    <section class="location" aria-label="Airport and local time">
      <div class="airport">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5.1-8 11-8 11S4 15.1 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span>LEEDS BRADFORD AIRPORT</span><strong class="slash">/</strong><strong class="blue">EGNM</strong>
      </div>
      <div class="clock" id="clock">--:--:--</div>
    </section>
    <div class="brand">drift<span class="blue">sky</span></div>
    <section class="weather" aria-label="Weather near Leeds Bradford Airport">
      <span class="piece"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h12a3 3 0 1 0-3-3"/><path d="M2 12h17a3 3 0 1 1-3 3"/><path d="M4 17h9a3 3 0 1 1-3 3"/></svg><span id="wind">-- mph</span></span>
      <span class="divider"></span>
      <span class="piece"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14V5a3 3 0 1 0-6 0v9a5 5 0 1 0 6 0Z"/><path d="M11 10v8"/></svg><span id="temperature">--°C</span></span>
      <span class="divider"></span>
      <span class="piece"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17a4 4 0 0 1 0-8 6 6 0 0 1 11.4 1.8A3.2 3.2 0 0 1 18 17Z"/><path d="m8 20-1 2m5-2-1 2m5-2-1 2"/></svg><span id="conditions">Loading…</span></span>
    </section>
  </header>

  <footer class="strip bottom" aria-label="Airport flight information">
    <div class="lineup">
      <div class="flight" aria-label="Next expected arrival">
        <span class="flight-icon" role="img" aria-label="Landing aircraft">🛬</span>
        <div class="flight-info">
          <div class="flight-label" id="arrival-label">NEXT EXPECTED ARRIVAL</div>
          <div class="flight-main" id="arrival">Checking airport schedule…</div>
        </div>
      </div>
      <div class="flight" aria-label="Next expected departure">
        <span class="flight-icon" role="img" aria-label="Departing aircraft">🛫</span>
        <div class="flight-info">
          <div class="flight-label" id="departure-label">NEXT EXPECTED DEPARTURE</div>
          <div class="flight-main" id="departure">Checking airport schedule…</div>
        </div>
      </div>
      <div class="subscribe" id="subscribe">
        <svg class="yt" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="5" fill="currentColor"/><path d="m10 8 6 4-6 4z" fill="#05101e"/></svg>
        <span>LIKE &amp; SUBSCRIBE</span>
        <svg class="bell" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
      </div>
    </div>
    <div class="attribution" id="attribution">Weather: Open-Meteo (CC BY 4.0) · Flight times: AeroDataBox · Estimates subject to change</div>
  </footer>
  <svg class="accent top-left" viewBox="0 0 65 76" preserveAspectRatio="none" aria-hidden="true"><path d="M1 1 57 75"/></svg>
  <svg class="accent top-right" viewBox="0 0 65 76" preserveAspectRatio="none" aria-hidden="true"><path d="M64 1 8 75"/></svg>
  <svg class="accent bottom-left" viewBox="0 0 65 84" preserveAspectRatio="none" aria-hidden="true"><path d="M55 0 1 84"/></svg>
  <svg class="accent bottom-right" viewBox="0 0 65 84" preserveAspectRatio="none" aria-hidden="true"><path d="M10 0 64 84"/></svg>
</main>
<script>
(()=>{'use strict';
  // No API secret is included in this publicly hosted page.
  const FLIGHTS_URL='https://driftsky-flight-data.rick-harrison.workers.dev/flights';
  const WEATHER_URL='https://api.open-meteo.com/v1/forecast?latitude=53.8659&longitude=-1.6606&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code&wind_speed_unit=mph&timezone=Europe%2FLondon';
  const $=id=>document.getElementById(id);
  const clockFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
  const hourFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  function setText(id,value){$(id).textContent=value;}
  function updateClock(){setText('clock',clockFormat.format(new Date()));}
  updateClock();setInterval(updateClock,1000);
  const directions=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  const codes={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Snow',77:'Snow',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunder',96:'Thunder',99:'Thunder'};
  async function getJSON(url){
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),12000);
    try{
      const response=await fetch(url,{cache:'no-store',signal:controller.signal});
      if(!response.ok)throw new Error('HTTP '+response.status);
      return await response.json();
    }finally{clearTimeout(timeout);}
  }
  async function updateWeather(){
    try{
      const data=(await getJSON(WEATHER_URL)).current;
      if(!data || !Number.isFinite(data.temperature_2m))throw new Error('Weather missing');
      setText('temperature',Math.round(data.temperature_2m)+'°C');
      const dir=Number.isFinite(data.wind_direction_10m)?directions[Math.round(data.wind_direction_10m/22.5)%16]+' ':' ';
      setText('wind',dir+Math.round(data.wind_speed_10m)+' mph');
      setText('conditions',codes[data.weather_code]||'Variable');
    }catch(error){
      if($('temperature').textContent==='--°C')setText('conditions','Weather unavailable');
      console.warn('Weather request failed',error.message);
    }
  }
  function dateFromSource(value){
    if(!value)return null;
    const input=String(value).trim().replace(' ','T');
    const date=new Date(input);
    if(!Number.isNaN(date.getTime()))return date;
    // If the feed omits its offset, interpret airport-local time in Europe/London.
    const match=input.match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/);
    if(!match)return null;
    const utcGuess=Date.UTC(+match[1],+match[2]-1,+match[3],+match[4],+match[5]);
    const utc=new Date(utcGuess);
    const localParts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(utc);
    const parts={};for(const p of localParts)parts[p.type]=p.value;
    const shifted=Date.UTC(+parts.year,+parts.month-1,+parts.day,+parts.hour,+parts.minute);
    return new Date(utcGuess+(utcGuess-shifted));
  }
  function flightSchedule(f,type){
    return dateFromSource(type==='arrival'
      ? (f.scheduledArrival || f.arrivalTime)
      : (f.scheduledDeparture || f.departureTime));
  }
  function flightEstimate(f,type){
    const arriving=type==='arrival';
    const revised=dateFromSource(arriving?f.revisedArrival:f.revisedDeparture);
    const predicted=dateFromSource(arriving?f.predictedArrival:f.predictedDeparture);
    const legacy=dateFromSource(arriving?f.arrivalTime:f.departureTime);
    const scheduled=flightSchedule(f,type);
    const when=revised || predicted || legacy || scheduled;
    const source=revised?'revised':predicted?'predicted':
      (scheduled && legacy && Math.abs(scheduled-legacy)>60000?'revised':'scheduled');
    const delayMins=scheduled && when?Math.round((when-scheduled)/60000):0;
    const explicitDelay=/delay/i.test(String(f.status||''));
    return {when,scheduled,source,delayMins,
      delayed:delayMins>=5 || explicitDelay,
      noEstimatedTime:explicitDelay && source==='scheduled'};
  }
  function selectUpcoming(list,type){
    const now=Date.now();
    return (Array.isArray(list)?list:[])
      .filter(f=>f && !/cancel|divert|arrived|landed|departed/i.test(String(f.status||'')))
      .map(f=>({flight:f,...flightEstimate(f,type)}))
      .filter(item=>item.when && item.when.getTime()>=now-10*60000 &&
        item.when.getTime()<=now+36*3600000)
      .sort((a,b)=>a.when-b.when)[0]||null;
  }
  function displayFlight(id,candidate,type,hasData){
    const element=$(id);element.replaceChildren();
    if(!candidate){
      element.textContent=hasData?'No future flights in cached board':'Awaiting fresh flight board';
      element.removeAttribute('title');return;
    }
    const f=candidate.flight;
    const number=String(f.number||'Flight').trim();
    const route=String((type==='arrival'?f.origin:f.destination)||'').trim()||'Unknown';
    const time=candidate.noEstimatedTime?'ETA TBC':hourFormat.format(candidate.when);
    function span(cls,txt){const x=document.createElement('span');x.className=cls;x.textContent=txt;return x;}
    element.append(span('code',number),span('sep','|'),span('route',route),span('sep','|'),span('flight-time',time));
    if(candidate.delayed)element.append(span('delay-badge','DELAYED'));
    const scheduledText=candidate.scheduled?hourFormat.format(candidate.scheduled):'not supplied';
    const kind=candidate.source==='revised'?'Revised estimate':candidate.source==='predicted'?'Predicted estimate':'Scheduled time';
    element.title=[number,route,kind+': '+time,'Scheduled: '+scheduledText,
      'Status: '+String(f.status||'not confirmed'),
      'Flight information is periodically cached; delays may differ from FR24'].join(' · ');
    element.setAttribute('aria-label',number+' '+route+' '+time+(candidate.delayed?' delayed':'')+
      ' (scheduled '+scheduledText+')');
  }
  async function updateFlights(){
    try{
      const data=await getJSON(FLIGHTS_URL);
      if(!Array.isArray(data.arrivals)||!Array.isArray(data.departures))throw new Error('Invalid flight data');
      const updated=dateFromSource(data.updated);
      const ageMs=updated?Date.now()-updated.getTime():Infinity;
      // Do not treat a cached flight timetable as live tracking. A 3-hour
      // cutoff was hiding the evening board between scheduled cron runs.
      // Keep a clearly labelled SCHEDULE ONLY board for up to 8 hours;
      // beyond that we refuse to show what may be yesterday's flights.
      const tooOld=ageMs < -15*60000 || ageMs > 8*3600000;
      const scheduleOnly=ageMs > 90*60000;
      const updatedAt=updated?hourFormat.format(updated)+' UK':'unknown';
      $('overlay').classList.toggle('cached-schedule',scheduleOnly || tooOld);
      $('arrival-label').textContent=scheduleOnly?'ARRIVALS · CACHED SCHEDULE':'NEXT EXPECTED ARRIVAL';
      $('departure-label').textContent=scheduleOnly?'DEPARTURES · CACHED SCHEDULE':'NEXT EXPECTED DEPARTURE';
      if(tooOld){
        displayFlight('arrival',null,'arrival',false);
        displayFlight('departure',null,'departure',false);
        setText('attribution','Weather: Open-Meteo (CC BY 4.0) · Flight board expired (last '+updatedAt+') · Awaiting next scheduled refresh');
        return;
      }
      const arrival=selectUpcoming(data.arrivals,'arrival');
      const departure=selectUpcoming(data.departures,'departure');
      displayFlight('arrival',arrival,'arrival',true);
      displayFlight('departure',departure,'departure',true);
      if(scheduleOnly){
        setText('attribution','Weather: Open-Meteo (CC BY 4.0) · AeroDataBox CACHED SCHEDULE only · Last update '+updatedAt+' · Delays not verified');
      }else{
        setText('attribution','Weather: Open-Meteo (CC BY 4.0) · Flights: AeroDataBox · Board updated '+updatedAt+' · Times subject to change');
      }
    }catch(error){
      if($('arrival').textContent==='Checking airport schedule…')displayFlight('arrival',null,'arrival',false);
      if($('departure').textContent==='Checking airport schedule…')displayFlight('departure',null,'departure',false);
      setText('attribution','Weather: Open-Meteo (CC BY 4.0) · Flight feed connection unavailable — check Cloudflare');
      console.warn('Flight feed unavailable',error.message);
    }
  }
  updateWeather();updateFlights();
  setInterval(updateWeather,5*60*1000);
  // Polls Cloudflare's KV-backed feed, not the paid flight provider.
  setInterval(updateFlights,2*60*1000);
  setInterval(()=>{const element=$('subscribe');element.classList.remove('highlight');void element.offsetWidth;element.classList.add('highlight');},30000);
})();
</script>
</body>
</html>
